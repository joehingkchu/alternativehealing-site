<h1><font size="4" color="#0000FF">Factors I XII</font></h1>
<p>&lt;<a href="http://www.graylab.ac.uk/omd/contents/haematology.html">haematology</a>&gt;
<a href="blood_clotting_factor.htm">Blood
clotting factors,</a> especially from <a href="http://www.graylab.ac.uk/cgi-bin/omd?humans">humans</a>.
These <a href="http://www.graylab.ac.uk/cgi-bin/omd?factors">factors</a> form a <a href="http://www.graylab.ac.uk/cgi-bin/omd?cascade">cascade</a>
in which the <a href="http://www.graylab.ac.uk/cgi-bin/omd?activation">activation</a>
of the <a href="http://www.graylab.ac.uk/cgi-bin/omd?first">first</a> factor <a href="http://www.graylab.ac.uk/cgi-bin/omd?leads">leads</a>
to enzymic <a href="http://www.graylab.ac.uk/cgi-bin/omd?attack">attack</a> on
the <a href="http://www.graylab.ac.uk/cgi-bin/omd?next">next</a> factor and so
on, <a href="http://www.graylab.ac.uk/cgi-bin/omd?finally">finally</a> resulting
in <a href="http://www.graylab.ac.uk/cgi-bin/omd?blood">blood</a> clotting.</p>
