<h1>flavin</h1>
<p>&lt;<a href="http://www.graylab.ac.uk/omd/contents/biochemistry.html">biochemistry</a>&gt;
A <a href="http://www.graylab.ac.uk/cgi-bin/omd?derivative">derivative</a> of <a href="http://www.graylab.ac.uk/cgi-bin/omd?riboflavin">riboflavin</a>
(<a href="http://www.graylab.ac.uk/cgi-bin/omd?vitamin+B2">vitamin B2</a>) which
can <a href="http://www.graylab.ac.uk/cgi-bin/omd?exist">exist</a> as a <a href="http://www.graylab.ac.uk/cgi-bin/omd?chemical">chemical</a>
<a href="http://www.graylab.ac.uk/cgi-bin/omd?group">group</a> of other
important <a href="http://www.graylab.ac.uk/cgi-bin/omd?biomolecules">biomolecules</a>
such as <a href="http://www.graylab.ac.uk/cgi-bin/omd?flavin+adenine+dinucleotide">flavin
adenine dinucleotide</a> or <a href="http://www.graylab.ac.uk/cgi-bin/omd?flavin+mononucleotide">flavin
mononucleotide</a>.</p>
